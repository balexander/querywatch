bundle:
  name: querywatch

artifacts:
  querywatch_wheel:
    type: whl
    path: ..
    build: hatch build

variables:
  job_name:
    description: Databricks job name
    default: querywatch
  source_table:
    description: Unity Catalog source for query history
    default: system.query.history
  results_table:
    description: Delta table for benchmark output
    default: dev.de.querywatch_optimization_results
  top_n:
    description: Top N candidate queries per run
    default: "10"
  n_runs:
    description: Number of benchmark runs per query variant
    default: "3"
  secret_scope:
    description: Secret scope containing OpenRouter API key
    default: querywatch-secrets
  secret_key:
    description: Secret key name containing OpenRouter API key
    default: openrouter-api-key
  openai_base_url:
    description: OpenRouter base URL for OpenAI-compatible SDK
    default: https://openrouter.ai/api/v1
  serverless_environment_version:
    description: Databricks serverless jobs environment version
    default: "4"

targets:
  dev:
    default: true

resources:
  jobs:
    querywatch:
      name: ${var.job_name}
      tasks:
        - task_key: run_querywatch
          python_wheel_task:
            package_name: querywatch
            entry_point: querywatch-job
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: ${var.serverless_environment_version}
            dependencies:
              - ../dist/*.whl
